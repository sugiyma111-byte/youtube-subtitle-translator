<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="manifest.open_in_tab" content="true"><title data-i18n="options.title"></title></head>
<body>
  <main class="layout">
    <header class="brand"><span class="logo" aria-hidden="true">字</span><div><strong data-i18n="app.name"></strong><div class="eyebrow" data-i18n="app.subtitle"></div></div><span class="badge version">0.1.0</span></header>
    <div class="intro"><p class="eyebrow" data-i18n="app.tagline"></p><h1 data-i18n="options.heading"></h1><p class="muted" data-i18n="options.intro"></p><label><span data-i18n="language.label"></span><select id="uiLanguage"></select></label></div>
    <div class="columns">
      <form id="settings-form">
        <section class="card"><div class="section-title"><span class="step">01</span><h2 data-i18n="options.service"></h2></div>
          <label><span data-i18n="options.provider"></span><select id="provider"><option value="sarashina" data-i18n="options.sarashina"></option><option value="openai-compatible" data-i18n="options.compatible"></option></select></label>
          <div id="custom-fields" hidden class="stack"><label><span data-i18n="options.baseUrl"></span><input id="customBaseUrl" type="url" placeholder="https://example.com/v1"><small data-i18n="options.baseUrlHint"></small></label><label><span data-i18n="options.model"></span><input id="customModel" data-i18n-placeholder="options.modelPlaceholder" maxlength="200"></label><label><span data-i18n="options.rpm"></span><input id="customRpm" type="number" min="1" max="120" value="30"></label></div>
          <label class="key-label"><span data-i18n="options.apiKey"></span> <span id="key-status" class="muted"></span><input id="apiKey" type="password" autocomplete="off" spellcheck="false" maxlength="4096"></label>
          <div class="row"><small data-i18n="options.keyStorage"></small><button id="remove-key" class="text-button" type="button" data-i18n="options.removeKey"></button></div>
        </section>
        <section class="card"><div class="section-title"><span class="step">02</span><h2 data-i18n="options.languages"></h2></div>
          <div class="two"><label><span data-i18n="options.sourceLang"></span><select id="sourceLang"></select></label><label><span data-i18n="options.targetLang"></span><select id="targetLang"></select></label></div>
          <div class="two custom-languages" id="custom-language-fields" hidden><label><span data-i18n="options.sourceCode"></span><input id="sourceCode" data-i18n-placeholder="options.sourceCodePlaceholder"></label><label><span data-i18n="options.targetCode"></span><input id="targetCode" data-i18n-placeholder="options.targetCodePlaceholder"></label></div>
          <label class="spaced"><span data-i18n="options.style"></span><select id="style"><option value="auto" data-i18n="options.styleAuto"></option><option value="plain" data-i18n="options.stylePlain"></option><option value="polite" data-i18n="options.stylePolite"></option></select></label>
          <small id="language-note"></small>
        </section>
        <section class="card"><div class="section-title"><span class="step">03</span><h2 data-i18n="options.appearance"></h2></div>
          <div class="two"><label><span data-i18n="options.displayMode"></span><select id="displayMode"><option value="bilingual" data-i18n="options.bilingual"></option><option value="translation" data-i18n="options.translationOnly"></option></select></label><label><span data-i18n="options.position"></span><select id="position"><option value="bottom" data-i18n="options.bottom"></option><option value="top" data-i18n="options.top"></option></select></label></div>
          <label class="spaced"><span data-i18n="options.fontSize"></span> <output id="font-output"></output><input id="fontSize" type="range" min="16" max="48" value="26"></label>
          <label class="spaced"><span data-i18n="options.lookahead"></span> <output id="lookahead-output"></output><input id="lookaheadSeconds" type="range" min="10" max="90" step="5" value="30"><small data-i18n="options.lookaheadHint"></small></label>
        </section>
        <div class="actions"><button class="primary" type="submit" id="save" data-i18n="options.save"></button><button type="button" id="test" data-i18n="options.test"></button></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
      <aside>
        <div class="preview-card"><div class="preview-header"><span class="preview-dot"></span><span data-i18n="options.preview"></span></div><div class="preview-screen"><div class="landscape"><span></span><span></span><span></span></div><div id="preview-caption"><div id="preview-translation" data-i18n="options.previewTranslation"></div><div id="preview-original" data-i18n="options.previewOriginal"></div></div><div class="preview-progress"></div></div><p><span data-i18n="options.previewFirst"></span><br><span data-i18n="options.previewSecond"></span></p></div>
        <div class="help"><h2 data-i18n="options.help"></h2><ol><li data-i18n="options.helpFirst"></li><li data-i18n="options.helpSecond"></li><li data-i18n="options.helpThird"></li></ol><p data-i18n="options.helpCaptions"></p><p data-i18n="options.privacy"></p><button id="clear-cache" type="button" data-i18n="options.clearCache"></button><p><a href="https://docs.sarashina.ai/" target="_blank" rel="noreferrer" data-i18n="options.apiDocs"></a></p></div>
      </aside>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body></html>
